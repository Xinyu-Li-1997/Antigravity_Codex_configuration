name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run sandbox installations and full offline regression suite
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -X utf8 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tempfile

          repo = pathlib.Path.cwd()
          py = [sys.executable, "-B", "-X", "utf8"]

          probe = subprocess.run([*py, "install.py", "--probe-apps"], cwd=repo, check=True, capture_output=True, text=True, encoding="utf-8")
          payload = json.loads(probe.stdout)
          assert "antigravity" in payload and "codex" in payload, payload

          with tempfile.TemporaryDirectory(prefix="user-guard-ci-") as tmp:
              base = pathlib.Path(tmp).resolve()
              commands = [
                  [*py, "install.py", "--app", "codex", "--codex-home", str(base / "codex_only"), "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "antigravity", "--target-dir", str(base / "agy_only" / "plugins" / "user-guard"), "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "both", "--target-dir", str(base / "both_agy" / "plugins" / "user-guard"), "--codex-home", str(base / "both_codex"), "--no-zotero"],
              ]
              for cmd in commands:
                  subprocess.run(cmd, cwd=repo, check=True)
          PY
