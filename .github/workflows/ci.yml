name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run sandbox installations and full offline regression suite
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -X utf8 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tempfile

          repo = pathlib.Path.cwd()
          py = [sys.executable, "-B", "-X", "utf8"]

          probe = subprocess.run([*py, "install.py", "--probe-apps"], cwd=repo, check=True, capture_output=True, text=True, encoding="utf-8")
          payload = json.loads(probe.stdout)
          assert all(name in payload for name in ("antigravity", "codex", "claude", "cc_switch")), payload

          with tempfile.TemporaryDirectory(prefix="user-guard-ci-") as tmp:
              base = pathlib.Path(tmp).resolve()
              commands = [
                  [*py, "install.py", "--app", "codex", "--codex-home", str(base / "codex_only"), "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "antigravity", "--target-dir", str(base / "agy_only" / "plugins" / "user-guard"), "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "claude", "--claude-home", str(base / "claude_only"), "--with-cc-router", "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "both", "--target-dir", str(base / "both_agy" / "plugins" / "user-guard"), "--codex-home", str(base / "both_codex"), "--no-zotero", "--skip-test"],
                  [*py, "install.py", "--app", "all", "--target-dir", str(base / "all_agy" / "plugins" / "user-guard"), "--codex-home", str(base / "all_codex"), "--claude-home", str(base / "all_claude"), "--with-cc-router", "--no-zotero"],
              ]
              for cmd in commands:
                  proc = subprocess.run(cmd, cwd=repo, capture_output=True, text=True, encoding="utf-8", errors="replace")
                  if proc.stdout:
                      sys.stdout.write(proc.stdout)
                  if proc.stderr:
                      sys.stderr.write(proc.stderr)
                  if proc.returncode != 0:
                      tail = " | ".join(
                          line.strip() for line in (proc.stdout + "\n" + proc.stderr).splitlines() if line.strip()
                      )[-800:]
                      print(f"::error::CI command failed (exit {proc.returncode}): {tail}", flush=True)
                      raise SystemExit(proc.returncode)
              def snapshot():
                  return {path.relative_to(base).as_posix():
                          (path.read_bytes() if path.is_file() else None, path.stat().st_mtime_ns)
                          for path in base.rglob("*")}

              before_audit = snapshot()
              audit = subprocess.run(
                  [*py, "install.py", "--audit-upgrade", "--target-dir", str(base / "all_agy" / "plugins" / "user-guard"),
                   "--codex-home", str(base / "all_codex"), "--claude-home", str(base / "all_claude")],
                  cwd=repo, check=True, capture_output=True, text=True, encoding="utf-8",
              )
              report = json.loads(audit.stdout)
              assert snapshot() == before_audit, "Upgrade audit changed sandbox files or directories"
              for name in ("antigravity", "codex", "claude"):
                  assert report[name]["drift_files"] == [], report[name]
          PY
